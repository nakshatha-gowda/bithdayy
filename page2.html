<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Happy Happy Birthday Gughuuukhaannn 🎂💖</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ff0080,
                    #7928ca,
                    #00c6ff,
                    #00f2fe
                );

            background-size: 400% 400%;

            animation: backgroundMove 8s ease infinite;

            color: white;
            text-align: center;
        }

        /* Background animation */

        @keyframes backgroundMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }

        .container {
            position: relative;
            z-index: 10;

            width: 90%;
            max-width: 800px;

            padding: 30px;
        }

        /* Small text */

        .hello {
            font-size: 25px;
            margin-bottom: 15px;

            animation: fadeIn 2s ease;
        }

        /* HAPPY HAPPY HAPPY */

        .happy {
            font-size: 55px;
            font-weight: bold;

            line-height: 1.2;
            margin-bottom: 20px;

            animation:
                bounce 1.5s infinite,
                rainbow 3s linear infinite;

            text-shadow:
                0 0 10px white,
                0 0 20px white,
                0 0 40px #ff00cc;
        }

        /* Name */

        .name {
            font-size: 60px;
            font-weight: 900;

            margin-bottom: 25px;

            background:
                linear-gradient(
                    90deg,
                    #ffeb3b,
                    #ff4081,
                    #00ffff,
                    #ffffff,
                    #ffeb3b
                );

            background-size: 300%;

            /* Standard property */
            background-clip: text;

            /* WebKit compatibility */
            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                rainbowText 4s linear infinite,
                namePop 2s ease infinite;
        }

        /* Birthday text */

        .birthday {
            font-size: 35px;
            font-weight: bold;

            margin-bottom: 30px;

            animation: heartbeat 1.5s infinite;
        }

        /* Next button */

        .next {
            display: inline-block;

            padding: 15px 35px;

            border-radius: 40px;
            border: 3px solid white;

            background: rgba(255, 255, 255, 0.2);

            color: white;
            text-decoration: none;

            font-size: 20px;
            font-weight: bold;

            backdrop-filter: blur(10px);

            transition: 0.3s;

            box-shadow:
                0 0 15px rgba(255, 255, 255, 0.7);
        }

        .next:hover {
            transform: scale(1.12);

            background: white;
            color: #ff4081;
        }

        /* MUSIC BUTTON */

        .music-button {
            position: fixed;

            top: 20px;
            right: 20px;

            width: 55px;
            height: 55px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.9);

            color: #ff1493;

            font-size: 25px;

            cursor: pointer;

            z-index: 100;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3);

            transition: 0.3s;
        }

        .music-button:hover {
            transform: scale(1.1);
            background: white;
        }

        /* Balloons */

        .balloon {
            position: absolute;

            font-size: 55px;

            animation: balloonFloat 6s linear infinite;
        }

        .b1 {
            left: 5%;
            bottom: -100px;
            animation-delay: 0s;
        }

        .b2 {
            left: 20%;
            bottom: -100px;
            animation-delay: 2s;
        }

        .b3 {
            right: 20%;
            bottom: -100px;
            animation-delay: 1s;
        }

        .b4 {
            right: 5%;
            bottom: -100px;
            animation-delay: 3s;
        }

        @keyframes balloonFloat {

            0% {
                transform: translateY(0) rotate(-5deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh) rotate(10deg);
                opacity: 0;
            }

        }

        /* Hearts */

        .heart {
            position: absolute;

            top: -50px;

            font-size: 30px;

            animation: heartFall 6s linear infinite;
        }

        @keyframes heartFall {

            0% {
                transform:
                    translateY(-50px)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }

        /* Sparkles */

        .sparkle {
            position: absolute;

            font-size: 25px;

            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {

            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }

        }

        /* Animations */

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

        }

        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

        }

        @keyframes rainbow {

            0% {
                color: #ffeb3b;
            }

            25% {
                color: #ff4081;
            }

            50% {
                color: #00ffff;
            }

            75% {
                color: #ffffff;
            }

            100% {
                color: #ffeb3b;
            }

        }

        @keyframes rainbowText {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }

        }

        @keyframes namePop {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }

        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* Mobile */

        @media (max-width: 600px) {

            .hello {
                font-size: 20px;
            }

            .happy {
                font-size: 38px;
            }

            .name {
                font-size: 42px;
            }

            .birthday {
                font-size: 25px;
            }

            .balloon {
                font-size: 40px;
            }

            .music-button {
                width: 48px;
                height: 48px;

                font-size: 22px;

                top: 15px;
                right: 15px;
            }

        }

    </style>

</head>

<body>

    <!-- BACKGROUND MUSIC -->

    <audio id="backgroundMusic" loop>
        <source src="love-song2.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>


    <!-- MUSIC PLAY / PAUSE BUTTON -->

    <button
        type="button"
        class="music-button"
        id="musicButton"
        title="Play / Pause Music"
        aria-label="Play or pause background music">

        🔊

    </button>


    <!-- Balloons -->

    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>
    <div class="balloon b4">🎈</div>


    <!-- Falling hearts -->

    <div class="heart" style="left: 8%; animation-delay: 0s;">❤️</div>
    <div class="heart" style="left: 18%; animation-delay: 2s;">💖</div>
    <div class="heart" style="left: 32%; animation-delay: 1s;">💕</div>
    <div class="heart" style="left: 50%; animation-delay: 3s;">💗</div>
    <div class="heart" style="left: 68%; animation-delay: 1.5s;">💓</div>
    <div class="heart" style="left: 82%; animation-delay: 4s;">💘</div>
    <div class="heart" style="left: 94%; animation-delay: 2.5s;">❤️</div>


    <!-- Sparkles -->

    <div class="sparkle" style="left: 15%; top: 20%;">✨</div>
    <div class="sparkle" style="left: 80%; top: 25%;">✨</div>
    <div class="sparkle" style="left: 25%; top: 75%;">⭐</div>
    <div class="sparkle" style="left: 75%; top: 70%;">✨</div>


    <!-- Main content -->

    <div class="container">

        <div class="hello">
            🥳✨ today is urs birthdayyyy alla mugudhoithu but it's belated dayyy ✨🥳
        </div>

        <div class="happy">
            HAPPY HAPPY HAPPY
        </div>

        <div class="name">
            BIRTHDAY
            <br>
            GUGUUUUKHAAANNNN 💖
        </div>

        <div class="birthday">
            🎂🎉💐🥳🎁💖✨
        </div>

        <a href="page3.html" class="next">
            yen gothaaaa🪐💕 →
        </a>

    </div>


    <!-- MUSIC SCRIPT -->

    <script>

        const music = document.getElementById("backgroundMusic");
        const musicButton = document.getElementById("musicButton");

        // Music volume
        music.volume = 0.7;

        // Update button icon
        function updateMusicButton() {
            musicButton.textContent = music.paused ? "🔇" : "🔊";
        }

        // Start music
        function startMusic() {

            music.play()
                .then(() => {
                    updateMusicButton();
                })
                .catch(() => {
                    updateMusicButton();
                });

        }

        // Try autoplay when page loads
        window.addEventListener("load", function () {
            startMusic();
        });

        // Start music after first interaction
        function enableMusicAfterInteraction() {

            startMusic();

            document.removeEventListener(
                "click",
                enableMusicAfterInteraction
            );

            document.removeEventListener(
                "touchstart",
                enableMusicAfterInteraction
            );

            document.removeEventListener(
                "keydown",
                enableMusicAfterInteraction
            );
        }

        document.addEventListener(
            "click",
            enableMusicAfterInteraction
        );

        document.addEventListener(
            "touchstart",
            enableMusicAfterInteraction
        );

        document.addEventListener(
            "keydown",
            enableMusicAfterInteraction
        );


        // Play / Pause button
        musicButton.addEventListener("click", function (event) {

            event.stopPropagation();

            if (music.paused) {

                music.play()
                    .then(() => {
                        updateMusicButton();
                    })
                    .catch(() => {
                        updateMusicButton();
                    });

            } else {

                music.pause();

                updateMusicButton();

            }

        });

    </script>

</body>

</html>
