<style>

/* =====================================================
   PAGE 7 BACKGROUND
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,180,220,0.35),
            transparent 25%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(255,120,190,0.25),
            transparent 25%
        ),

        linear-gradient(
            135deg,
            #ffe6f3,
            #ffd1e8,
            #fff5fa
        );

    overflow-x: hidden;

}


/* =====================================================
   TITLE
===================================================== */

.gallery-title {

    text-align: center;

    color: #ff3f9d;

    font-size: 38px;

    margin: 25px 10px 5px;

    text-shadow:
        0 0 8px white,
        0 0 18px #ff9ed0;

    animation: titleGlow 2s infinite alternate;

}

@keyframes titleGlow {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }

}


.gallery-subtitle {

    text-align: center;

    color: #d93686;

    font-size: 17px;

    margin: 0 10px 25px;

}


/* =====================================================
   PHOTO GALLERY
===================================================== */

.photo-gallery {

    width: 95%;

    max-width: 1200px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 18px;

    padding: 15px;

}


/* =====================================================
   PHOTO BOX
===================================================== */

.photo-card {

    position: relative;

    aspect-ratio: 1 / 1;

    background: white;

    padding: 7px;

    border-radius: 18px;

    border: 3px solid #ff69b4;

    box-shadow:

        0 0 10px rgba(255,105,180,0.35),

        0 8px 20px rgba(255,80,160,0.20);

    opacity: 0;

    transform:
        scale(0.7)
        translateY(25px);

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;

}


/* PHOTO */

.photo-card img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    border-radius: 12px;

    display: block;

}


/* ACTIVE PHOTO */

.photo-card.show {

    opacity: 1;

    transform:
        scale(1)
        translateY(0);

}


/* =====================================================
   HEART
===================================================== */

.photo-heart {

    position: absolute;

    right: -8px;

    bottom: -10px;

    font-size: 25px;

    animation: heartBeat 1.2s infinite;

}

@keyframes heartBeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.3);
    }

}


/* =====================================================
   NEXT BUTTON
===================================================== */

.gallery-next {

    display: none;

    margin: 25px auto 40px;

    padding: 13px 32px;

    border: 3px solid #ff69b4;

    border-radius: 40px;

    background: white;

    color: #ff4fa3;

    font-size: 17px;

    font-weight: bold;

    text-decoration: none;

    cursor: pointer;

    width: fit-content;

    box-shadow:

        0 0 10px rgba(255,105,180,0.7),

        0 0 25px rgba(255,105,180,0.35);

    transition: 0.3s;

}


.gallery-next:hover {

    transform: scale(1.08);

    background: #fff5fa;

    color: #ff1493;

    border-color: #ff1493;

    box-shadow:

        0 0 18px #ff69b4,

        0 0 35px rgba(255,105,180,0.6);

}


/* =====================================================
   MUSIC BUTTON
===================================================== */

.music-button {

    position: fixed;

    top: 18px;

    right: 18px;

    z-index: 1000;

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border: 2px solid #ff69b4;

    background: rgba(255,255,255,0.9);

    color: #ff3f9d;

    font-size: 22px;

    cursor: pointer;

    box-shadow:

        0 0 10px rgba(255,105,180,0.6),

        0 0 25px rgba(255,105,180,0.3);

    transition: 0.3s;

}

.music-button:hover {

    transform: scale(1.1);

    background: #fff5fa;

}


/* =====================================================
   FLOATING HEARTS
===================================================== */

.floating-heart {

    position: fixed;

    font-size: 28px;

    pointer-events: none;

    animation:
        floatHeart 5s linear infinite;

    opacity: 0.8;

    z-index: 1;

}


.heart1 {
    left: 5%;
    bottom: -50px;
}

.heart2 {
    left: 25%;
    bottom: -50px;
    animation-delay: 1s;
}

.heart3 {
    left: 50%;
    bottom: -50px;
    animation-delay: 2s;
}

.heart4 {
    left: 75%;
    bottom: -50px;
    animation-delay: 3s;
}

.heart5 {
    left: 90%;
    bottom: -50px;
    animation-delay: 4s;
}


@keyframes floatHeart {

    0% {

        transform:
            translateY(0)
            scale(0.8);

        opacity: 0;

    }

    20% {
        opacity: 1;
    }

    100% {

        transform:
            translateY(-110vh)
            scale(1.3);

        opacity: 0;

    }

}


/* =====================================================
   MOBILE
===================================================== */

<script>


/* =====================================================
   GET ELEMENTS
===================================================== */

const photos =
    document.querySelectorAll(".photo-card");

const nextButton =
    document.getElementById("nextButton");

const music =
    document.getElementById("backgroundMusic");

const musicButton =
    document.getElementById("musicButton");

let currentPhoto = 0;


/* =====================================================
   MUSIC SETTINGS
===================================================== */

music.volume = 0.7;


/* =====================================================
   AUTOMATIC MUSIC PLAY
===================================================== */

function startMusic() {

    music.play()

        .then(() => {

            musicButton.innerHTML = "🔊";

        })

        .catch(() => {

            /*
             * Browser blocked autoplay.
             * Music will start after the user's
             * first click or touch.
             */

        });

}


/* TRY TO PLAY WHEN PAGE OPENS */

window.addEventListener("load", () => {

    startMusic();

});


/* =====================================================
   START MUSIC AFTER FIRST USER INTERACTION
===================================================== */

function enableMusicAfterInteraction() {

    startMusic();

    document.removeEventListener(
        "click",
        enableMusicAfterInteraction
    );

    document.removeEventListener(
        "touchstart",
        enableMusicAfterInteraction
    );

    document.removeEventListener(
        "keydown",
        enableMusicAfterInteraction
    );

}


/* Listen for first interaction */

document.addEventListener(
    "click",
    enableMusicAfterInteraction
);

document.addEventListener(
    "touchstart",
    enableMusicAfterInteraction
);

document.addEventListener(
    "keydown",
    enableMusicAfterInteraction
);


/* =====================================================
   PLAY / PAUSE MUSIC BUTTON
===================================================== */

musicButton.addEventListener(
    "click",
    function(event) {

        /*
         * Prevent the general click handler
         * from causing problems.
         */

        event.stopPropagation();

        if (music.paused) {

            music.play();

            musicButton.innerHTML = "🔊";

        }

        else {

            music.pause();

            musicButton.innerHTML = "🔇";

        }

    }
);


/* =====================================================
   SHOW PHOTOS ONE BY ONE
   EACH PHOTO = 3 SECONDS
===================================================== */

function showNextPhoto() {

    if (currentPhoto < photos.length) {

        photos[currentPhoto]
            .classList.add("show");

        currentPhoto++;

        setTimeout(
            showNextPhoto,
            3000
        );

    }

    else {

        /* =================================================
           ALL 30 PHOTOS FINISHED
        ================================================= */

        nextButton.style.display = "block";

    }

}


/* =====================================================
   START PHOTO ANIMATION
===================================================== */

showNextPhoto();


</script>
