<script>

/* =====================================================
   BACKGROUND MUSIC
===================================================== */

const music =
    document.getElementById("backgroundMusic");

const musicButton =
    document.getElementById("musicButton");


/* MUSIC VOLUME */

music.volume = 0.7;


/* =====================================================
   PLAY MUSIC
===================================================== */

function startMusic() {

    music.play()

        .then(() => {

            musicButton.innerHTML = "🔊";

        })

        .catch(() => {

            /*
             * Some browsers block automatic
             * audio until the user interacts
             * with the page.
             */

        });

}


/* =====================================================
   TRY AUTOPLAY WHEN PAGE OPENS
===================================================== */

window.addEventListener("load", () => {

    startMusic();

});


/* =====================================================
   START MUSIC AFTER FIRST INTERACTION
===================================================== */

function enableMusicAfterInteraction() {

    startMusic();

    document.removeEventListener(
        "click",
        enableMusicAfterInteraction
    );

    document.removeEventListener(
        "touchstart",
        enableMusicAfterInteraction
    );

    document.removeEventListener(
        "keydown",
        enableMusicAfterInteraction
    );

}


/* =====================================================
   FIRST CLICK / TOUCH / KEYBOARD
===================================================== */

document.addEventListener(
    "click",
    enableMusicAfterInteraction
);

document.addEventListener(
    "touchstart",
    enableMusicAfterInteraction
);

document.addEventListener(
    "keydown",
    enableMusicAfterInteraction
);


/* =====================================================
   MUSIC PLAY / PAUSE BUTTON
===================================================== */

musicButton.addEventListener(
    "click",
    function(event) {

        /*
         * Stop this click from triggering
         * the general interaction listener.
         */

        event.stopPropagation();


        if (music.paused) {

            music.play();

            musicButton.innerHTML = "🔊";

        }

        else {

            music.pause();

            musicButton.innerHTML = "🔇";

        }

    }
);

</script>
